name: Tests

# GitHub Pages publie directement la branche main (Settings → Pages → Deploy from a branch).
# Ici on vérifie seulement la simulation à chaque push.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/sim.test.mjs
